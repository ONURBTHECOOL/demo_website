<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="https://onurbthecool.github.io/demo_website/mini_projects/calculator/calculator.css">
  </head>
  <body>
    <div class="calculator">
      <div class="display" aria-live="polite">
        <div class="previous" id="previous">0</div>
        <div class="current" id="current">0</div>
      </div>

      <div class="buttons">
        <button class="action clear" data-action="clear">C</button>
        <button class="action" data-action="delete">DEL</button>
        <button class="operator" data-value="/">÷</button>
        <button class="operator" data-value="*">×</button>

        <button class="digit" data-value="7">7</button>
        <button class="digit" data-value="8">8</button>
        <button class="digit" data-value="9">9</button>
        <button class="operator" data-value="-">−</button>

        <button class="digit" data-value="4">4</button>
        <button class="digit" data-value="5">5</button>
        <button class="digit" data-value="6">6</button>
        <button class="operator" data-value="+">+</button>

        <button class="digit" data-value="1">1</button>
        <button class="digit" data-value="2">2</button>
        <button class="digit" data-value="3">3</button>
        <button class="equals" data-action="equals">=</button>

        <button class="digit" data-value="0" style="grid-column: span 2;">0</button>
        <button class="digit" data-value=".">.</button>
        <button class="action" data-action="percent">%</button>
      </div>
    </div>

    <script src="https://onurbthecool.github.io/demo_website/mini_projects/calculator/calculator.js"></script>
  </body>
</html>

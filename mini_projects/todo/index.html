<html lang="en">

<head>

    <title>To-Do List</title>
    <link rel="stylesheet" href="https://onurbthecool.github.io/demo_website/style.css">
</head>

<body>
    <form>
        <fieldset>
            <legend>Todo list</legend>

            <label>
                <input type="checkbox" name="tasks" value="task1" checked>
                Write some code
            </label><br>

            <label>
                <input type="checkbox" name="tasks" value="task2">
                Review some code
            </label><br>

            <label>
                <input type="checkbox" name="tasks" value="task3">
                Re-write some code
            </label>
        </fieldset>
    </form>
